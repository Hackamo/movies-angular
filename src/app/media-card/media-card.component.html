<mat-card
	[routerLink]="['/', routerType(), mediaInfos().id]"
	class="card"
	[class.is-phone-portrait]="isPhonePortrait()"
>
	@if (mediaInfos().poster_path) {
		<img
			mat-card-image
			[ngSrc]="'https://image.tmdb.org/t/p/w342/' + mediaInfos().poster_path"
			[alt]="'Photo of ' + (mediaInfos().title || mediaInfos().name)"
			width="342"
			height="513"
		/>
	}
	<div class="media-info">
		<mat-card-title class="title">{{ mediaInfos().title || mediaInfos().name }}</mat-card-title>
		<mat-card-subtitle [style]="getNoteColor()" class="note">
			{{ mediaInfos().vote_average | number: '1.0-1' }}
		</mat-card-subtitle>
	</div>
</mat-card>
