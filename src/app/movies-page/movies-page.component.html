<button
  mat-raised-button
  class="buttonGetMovies"
  color="accent"
  (click)="getMovies()"
>
  Get Movies
</button>
<div
  class="main"
  infiniteScroll
  [infiniteScrollDistance]="2"
  [infiniteScrollThrottle]="50"
  (scrolled)="onScroll()"
>
  @for (movie of movies; track movie) {
    <div>
      <app-movie-card [movieInfos]="movie"></app-movie-card>
    </div>
  }
</div>
